<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>UNIX Research — Open Knowledge Base</title>
<meta name="description" content="A curated study of the tools that shaped modern computing." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   1. RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
img, svg, canvas { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
input { font: inherit; color: inherit; background: none; border: 0; outline: none; }

/* ============================================================
   2. VARIABLES
   ============================================================ */
:root {
  --bg-0: #050308;
  --bg-1: #0a0710;
  --bg-2: #120a1e;
  --fg-0: #ede7f6;
  --fg-1: #b8a9d1;
  --fg-2: #6c5f88;
  --line: rgba(160, 130, 220, 0.14);
  --line-strong: rgba(180, 150, 255, 0.32);
  --violet-0: #a273ff;
  --violet-1: #7a4dff;
  --violet-2: #4b2a9a;
  --plum: #2a1444;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 0.45s;

  --glass-bg: rgba(24, 14, 42, 0.42);
  --glass-bg-hi: rgba(28, 16, 50, 0.55);
  --glass-border: rgba(200, 170, 255, 0.16);
  --glass-border-hi: rgba(220, 195, 255, 0.30);
}

/* ============================================================
   3. BASE
   ============================================================ */
html, body {
  background: var(--bg-0);
  color: var(--fg-0);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.65;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body {
  min-height: 100vh;
  overflow-x: clip;
  position: relative;
}
body.smoke-fallback {
  background:
    radial-gradient(65% 55% at 28% 38%, rgba(122, 77, 255, 0.20), transparent 72%),
    radial-gradient(55% 65% at 78% 62%, rgba(75, 42, 154, 0.24), transparent 72%),
    radial-gradient(40% 40% at 55% 20%, rgba(162, 115, 255, 0.10), transparent 70%),
    var(--bg-0);
}
::selection { background: rgba(122, 77, 255, 0.35); color: #fff; }
:focus-visible { outline: 1px solid var(--violet-0); outline-offset: 3px; border-radius: 6px; }

#root { position: relative; }

/* ============================================================
   3.1 LANGUAGE TRANSITION
   ============================================================ */
main,
.footer,
.nav-links,
.nav-explore {
  transition:
    opacity 0.34s var(--ease),
    transform 0.34s var(--ease);
  will-change: opacity, transform;
}

body.lang-switching main,
body.lang-switching .footer {
  opacity: 0;
  transform: translateY(8px);
}

body.lang-switching .nav-links,
body.lang-switching .nav-explore {
  opacity: 0;
}

/* Hero elements fade as a group, hero-anim keeps its intro animation */
body.lang-switching .hero-inner {
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  main, .footer, .nav-links, .nav-explore { transition-duration: 0.001ms !important; }
  body.lang-switching main,
  body.lang-switching .footer,
  body.lang-switching .nav-links,
  body.lang-switching .nav-explore {
    opacity: 1 !important;
    transform: none !important;
  }
}

/* ============================================================
   4. COMPONENTS
   ============================================================ */

/* --- 4.1 Liquid Glass --- */
.glass {
  position: relative;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  overflow: hidden;
  isolation: isolate;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.09),
    inset 0 -1px 0 rgba(0, 0, 0, 0.36),
    0 14px 44px rgba(0, 0, 0, 0.46),
    0 0 0 1px rgba(160, 120, 255, 0.05);
  transition:
    background var(--dur) var(--ease),
    border-color var(--dur) var(--ease),
    box-shadow var(--dur) var(--ease),
    transform var(--dur) var(--ease);
}
.glass::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(120% 62% at 50% 0%,
      rgba(255, 255, 255, 0.14) 0%,
      rgba(200, 170, 255, 0.06) 42%,
      transparent 74%),
    radial-gradient(52% 42% at 0% 0%,
      rgba(200, 170, 255, 0.12) 0%,
      transparent 70%);
  mix-blend-mode: screen;
}
.glass::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(115deg,
    transparent 38%,
    rgba(255, 255, 255, 0.10) 50%,
    transparent 62%);
  background-size: 300% 100%;
  background-position: 200% 0;
  mix-blend-mode: screen;
  animation: glassShimmer 9s linear infinite;
}
@keyframes glassShimmer {
  0%   { background-position: 220% 0; }
  100% { background-position: -120% 0; }
}
.glass > * { position: relative; z-index: 3; }

@media (min-width: 768px) and (hover: hover) {
  .glass {
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
  }
  .glass:hover {
    background: var(--glass-bg-hi);
    border-color: var(--glass-border-hi);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.14),
      inset 0 -1px 0 rgba(0, 0, 0, 0.40),
      0 18px 54px rgba(0, 0, 0, 0.52),
      0 0 30px rgba(140, 90, 255, 0.10),
      0 0 0 1px rgba(180, 150, 255, 0.07);
  }
}

body.weak .glass,
body.low-fps .catalog-card.glass {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  background: rgba(20, 12, 38, 0.86);
}
body.weak .nav.scrolled {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  background: rgba(14, 8, 26, 0.92);
}
body.low-fps .catalog-card.glass { background: rgba(20, 12, 38, 0.72); }

/* --- 4.2 Buttons --- */
.btn-primary {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 26px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: #fff;
  background: linear-gradient(135deg, var(--violet-1) 0%, var(--violet-2) 100%);
  border: 1px solid rgba(180, 150, 255, 0.30);
  overflow: hidden;
  isolation: isolate;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.24),
    0 10px 30px rgba(90, 50, 200, 0.30),
    0 0 0 1px rgba(122, 77, 255, 0.10);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.42) 50%, transparent 65%);
  background-size: 260% 100%;
  background-position: 180% 0;
  transition: background-position 0.9s var(--ease);
  pointer-events: none;
}
.btn-primary:hover {
  transform: translateY(-2px);
  border-color: rgba(220, 195, 255, 0.50);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.30),
    0 16px 44px rgba(110, 60, 230, 0.42),
    0 0 26px rgba(140, 90, 255, 0.24);
}
.btn-primary:hover::after { background-position: -60% 0; }

.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 26px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  color: var(--fg-0);
  border-radius: 999px;
}
.btn-ghost:hover { transform: translateY(-2px); }

.btn-copy {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-2);
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  transition: color 0.3s var(--ease), border-color 0.3s var(--ease), background 0.3s var(--ease);
  flex-shrink: 0;
}
.btn-copy:hover {
  color: var(--fg-0);
  border-color: var(--line);
  background: rgba(122, 77, 255, 0.10);
}

/* --- 4.3 Mono & headings --- */
.mono {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  font-feature-settings: 'zero' 1;
}
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--fg-2);
}
.section-title {
  font-size: clamp(30px, 4.4vw, 52px);
  font-weight: 600;
  line-height: 1.12;
  letter-spacing: -0.028em;
  color: var(--fg-0);
}
.section-head {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-bottom: 64px;
  max-width: 780px;
}
.section-head .eyebrow { display: block; }

.hl { color: var(--violet-0); }
.strong { color: var(--fg-0); font-weight: 500; }

/* --- 4.4 Chips --- */
.chip {
  display: inline-flex;
  align-items: center;
  padding: 8px 16px;
  border-radius: 999px !important;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--fg-1);
  border: 1px solid var(--line);
  background: rgba(24, 14, 42, 0.28);
  cursor: pointer;
  transition: all 0.35s var(--ease);
  white-space: nowrap;
}
.chip:hover {
  color: var(--fg-0);
  border-color: var(--glass-border-hi);
  background: rgba(28, 16, 50, 0.50);
}
.chip.active {
  color: var(--fg-0);
  border-color: var(--glass-border-hi);
  background: rgba(122, 77, 255, 0.20);
  box-shadow: 0 0 22px rgba(140, 90, 255, 0.18), inset 0 1px 0 rgba(255,255,255,0.10);
}

/* ============================================================
   5. SECTIONS
   ============================================================ */

/* --- 5.0 Smoke / Cursor / FPS --- */
.smoke-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
.cursor-glow {
  position: fixed;
  width: 380px;
  height: 380px;
  left: 0;
  top: 0;
  margin-left: -190px;
  margin-top: -190px;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(circle,
    rgba(122, 77, 255, 0.16) 0%,
    rgba(122, 77, 255, 0.07) 38%,
    rgba(122, 77, 255, 0.00) 70%);
  opacity: 0;
  transition: opacity 0.8s var(--ease);
  will-change: transform;
}
@media (hover: hover) and (min-width: 768px) {
  .cursor-glow { opacity: 1; }
}
.fps-meter {
  position: fixed;
  right: 18px;
  bottom: 16px;
  z-index: 60;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--fg-2);
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(10, 7, 16, 0.50);
  pointer-events: none;
  user-select: none;
}

/* --- 5.1 Navbar --- */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  border-bottom: 1px solid transparent;
  transition: background 0.5s var(--ease), border-color 0.5s var(--ease), box-shadow 0.5s var(--ease);
}
.nav.scrolled {
  background: rgba(16, 9, 28, 0.58);
  border-bottom-color: var(--line);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.055),
    0 10px 34px rgba(0, 0, 0, 0.38);
}
@media (min-width: 768px) and (hover: hover) {
  .nav.scrolled {
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
  }
}
.nav-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 32px;
}
.nav-logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.logo-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--violet-0);
  box-shadow: 0 0 12px rgba(162, 115, 255, 0.9), 0 0 26px rgba(122, 77, 255, 0.5);
  animation: logoPulse 3.6s var(--ease) infinite;
}
@keyframes logoPulse {
  0%, 100% { opacity: 0.55; }
  50%      { opacity: 1; }
}
.logo-text {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.22em;
  color: var(--fg-0);
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 30px;
  margin-left: auto;
}
.nav-links a {
  font-size: 13px;
  color: var(--fg-1);
  letter-spacing: 0.01em;
  transition: color 0.35s var(--ease), gap 0.35s var(--ease);
  position: relative;
}
.nav-links a::after {
  content: '';
  position: absolute;
  left: 0; bottom: -4px;
  width: 0; height: 1px;
  background: var(--violet-0);
  transition: width 0.45s var(--ease);
}
.nav-links a:hover { color: var(--fg-0); }
.nav-links a:hover::after { width: 100%; }
.nav-right {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
.lang-switch {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border-radius: 999px;
  gap: 2px;
}
.lang-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.10em;
  padding: 5px 11px;
  border-radius: 999px;
  color: var(--fg-2);
  transition: color 0.35s var(--ease), background 0.35s var(--ease), box-shadow 0.35s var(--ease);
}
.lang-btn.active {
  color: var(--fg-0);
  background: rgba(122, 77, 255, 0.30);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 0 16px rgba(140, 90, 255, 0.22);
}
.lang-btn:not(.active):hover { color: var(--fg-1); }
.nav-explore {
  padding: 9px 18px;
  font-size: 13px;
}

/* --- 5.2 Hero --- */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 160px 24px 100px;
  z-index: 2;
}
.hero-inner { max-width: 1080px; width: 100%; }
.hero-anim {
  opacity: 0;
  transform: translateY(22px);
  animation: heroIn 1.15s var(--ease) forwards;
}
@keyframes heroIn {
  to { opacity: 1; transform: translateY(0); }
}
.hero-eyebrow {
  display: inline-block;
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(24, 14, 42, 0.35);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--fg-1);
}
.hero-title {
  font-size: clamp(80px, 18vw, 240px);
  font-weight: 800;
  line-height: 0.88;
  letter-spacing: -0.055em;
  margin: 28px 0 12px;
  background: linear-gradient(180deg, #f4ecff 0%, #cdb8ff 52%, #7a4dff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
.hero-sub {
  font-size: clamp(16px, 2.1vw, 24px);
  font-weight: 300;
  letter-spacing: 0.01em;
  color: var(--fg-1);
  margin-bottom: 26px;
}
.hero-desc {
  font-size: 15px;
  line-height: 1.8;
  color: var(--fg-2);
  max-width: 560px;
  margin: 0 auto 42px;
}
.hero-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
}

/* --- 5.3 Section base --- */
.section {
  position: relative;
  padding: 120px 24px;
  z-index: 2;
}
.container { max-width: 1240px; margin: 0 auto; }
section[id] { scroll-margin-top: 90px; }

/* --- 5.4 About --- */
.about-grid {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 80px;
  align-items: start;
}
.about-title {
  font-size: clamp(28px, 3.6vw, 44px);
  font-weight: 600;
  line-height: 1.16;
  letter-spacing: -0.028em;
  color: var(--fg-0);
}
.about-body p {
  font-size: 15.5px;
  line-height: 1.85;
  color: var(--fg-1);
  margin-bottom: 22px;
}
.about-body p:last-child { margin-bottom: 0; }

/* --- 5.5 Why --- */
.why-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px;
}
.why-card {
  padding: 30px 26px 34px;
  min-width: 0;
}
.why-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--violet-0);
  display: block;
  margin-bottom: 22px;
}
.why-card h3 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.012em;
  margin-bottom: 12px;
  color: var(--fg-0);
}
.why-card p {
  font-size: 13.5px;
  line-height: 1.72;
  color: var(--fg-2);
}
.why-card:hover { transform: translateY(-4px); }

/* --- 5.6 Catalog --- */
.catalog-controls {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-bottom: 40px;
}
.search-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-radius: 16px;
  max-width: 480px;
}
.search-wrap svg { flex-shrink: 0; opacity: 0.55; }
.search-wrap input {
  flex: 1 1 0;
  min-width: 0;
  font-size: 14px;
  color: var(--fg-0);
  letter-spacing: 0.01em;
}
.search-wrap input::placeholder { color: var(--fg-2); }
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.catalog-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}
.catalog-card {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 24px 22px 22px;
  min-width: 0;
  cursor: pointer;
}
.catalog-card:hover { transform: translateY(-4px); }
.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}
.card-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--fg-0);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-cat {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-2);
  flex-shrink: 0;
}
.card-desc {
  font-size: 13px;
  line-height: 1.65;
  color: var(--fg-1);
  min-height: 42px;
}
.terminal {
  min-width: 0;
  overflow: hidden;
  border-radius: 12px;
  border: 1px solid rgba(160, 130, 220, 0.12);
  background: rgba(6, 3, 14, 0.55);
  padding: 10px 12px 11px;
}
.term-head {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 8px;
}
.term-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  background: rgba(160, 130, 220, 0.26);
}
.term-line {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  line-height: 1.5;
}
.term-prompt {
  flex-shrink: 0;
  color: var(--violet-0);
  opacity: 0.85;
}
.term-cmd {
  min-width: 0;
  flex: 1 1 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--fg-1);
}
.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 2px;
}
.card-explore {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.35s var(--ease), gap 0.35s var(--ease);
}
.catalog-card:hover .card-explore { color: var(--violet-0); gap: 10px; }
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 70px 20px;
  color: var(--fg-2);
  font-family: 'JetBrains Mono', monospace;

const smokeVert = /* glsl */`
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

const smokeFrag = /* glsl */`
precision highp float;

varying vec2 vUv;

uniform float uTime;
uniform vec2  uMouse;
uniform vec2  uRes;
uniform float uQuality;
uniform float uSpeed;

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
  for (int i = 0; i < 4; i++) {
    v += a * noise(p);
    p = rot * p * 2.02;
    a *= 0.5;
  }
  return v;
}

void main() {
  float aspect = uRes.x / max(uRes.y, 1.0);
  vec2 par = uMouse * 0.06;
  vec2 p = (vUv - 0.5 + par) * vec2(aspect, 1.0) * 2.0;

  float t = uTime * 0.06 * uSpeed;

  // ---- Layer 1: domain-warped fBm (выше частота, больше структуры) ----
  vec2 q = vec2(
    fbm(p * 1.25 + vec2(0.0, t * 0.70)),
    fbm(p * 1.25 + vec2(5.2, 1.3) - vec2(t * 0.50, 0.0))
  );
  vec2 r = vec2(
    fbm(p * 1.25 + 3.2 * q + vec2(1.7, 9.2) + vec2(t * 0.40, 0.0)),
    fbm(p * 1.25 + 3.2 * q + vec2(8.3, 2.8) - vec2(0.0, t * 0.30))
  );
  float f1 = fbm(p * 1.25 + 3.5 * r);

  // ---- Layer 2: counter-moving ----
  vec2 p2 = p * 1.85 + vec2(3.0, -1.5);
  float f2 = fbm(p2 + vec2(-t * 0.25, t * 0.15) + q * 1.30);

  // ---- Layer 3: slow, wide ----
  vec2 p3 = p * 0.85 + vec2(-2.0, 2.5);
  float f3 = fbm(p3 + vec2(t * 0.18, -t * 0.22) + r * 1.10);

  float density = f1 * 0.50 + f2 * 0.30 + f3 * 0.20;
  density = smoothstep(0.18, 0.82, density);

  vec3 cPlum  = vec3(0.165, 0.078, 0.267);
  vec3 cLilac = vec3(0.478, 0.306, 1.000);
  vec3 cPink  = vec3(0.635, 0.451, 1.000);

  vec3 col = mix(cPlum, cLilac, smoothstep(0.00, 0.60, density));
  col = mix(col, cPink, smoothstep(0.60, 1.00, density));

  float glow = pow(density, 2.2);
  col *= 0.42 + glow * 1.50;

  // Мягкая виньетка — только чуть гасит самые углы (радиус угла ≈ 2.04)
  float radius = length(p);
  float vign = smoothstep(2.60, 0.40, radius);
  col *= mix(0.72, 1.0, vign);

  col *= mix(0.68, 1.0, centerDark);

    col += (g - 0.5) * 0.030;
  }

  gl_FragColor = vec4(col, 1.0);
}
`;

uniform sampler2D uCurrent;
uniform sampler2D uPrev;
uniform vec2  uVel;
uniform float uBlur;
uniform float uBlend;

void main() {
  vec2 off = uVel * uBlur;

  vec3 c1 = texture2D(uCurrent, vUv - off).rgb;
  vec3 c2 = texture2D(uCurrent, vUv - off * 2.0).rgb;
  vec3 c3 = texture2D(uCurrent, vUv - off * 3.0).rgb;

  vec3 cur = (c0 + c1 + c2 + c3) * 0.25;
  vec3 prv = texture2D(uPrev, vUv).rgb;

  vec3 col = mix(cur, prv, uBlend);
  gl_FragColor = vec4(col, 1.0);
}

/* ============================================================
   LANGUAGE CONTEXT
   ============================================================ */

function getInitialLang() {
  try {
    const saved = localStorage.getItem('unix-lang');
    if (saved === 'en' || saved === 'ru') return saved;
  } catch (e) { /* ignore */ }
  const nav = (navigator.language || 'en').toLowerCase();
  return nav.startsWith('ru') ? 'ru' : 'en';
}

const LangContext = createContext({
  lang: 'en',
  targetLang: 'en',
  setLang: () => {},
  t: TRANSLATIONS.en
});

function useLang() {
  return useContext(LangContext);
}

function LangProvider({ children }) {
  const [targetLang, setTargetLang] = useState(getInitialLang);
  const [activeLang, setActiveLang] = useState(getInitialLang);

  const setLang = useCallback((l) => {
    setTargetLang((prev) => (prev === l ? prev : l));
  }, []);

  /* Плавный переход: fade-out → swap контента → fade-in */
  useEffect(() => {
    if (targetLang === activeLang) return;

    document.body.classList.add('lang-switching');

    const id = setTimeout(() => {
      setActiveLang(targetLang);
      try { localStorage.setItem('unix-lang', targetLang); } catch (e) { /* ignore */ }
      document.documentElement.lang = targetLang;

      /* Двойной rAF — даём браузеру отрисовать новый текст, потом снимаем класс */
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.body.classList.remove('lang-switching');
        });
      });
    }, 280);

    return () => {
      clearTimeout(id);
    };
  }, [targetLang, activeLang]);

  useEffect(() => {
    document.documentElement.lang = activeLang;
  }, [activeLang]);

  const value = useMemo(() => ({
    lang: activeLang,
    targetLang,
    setLang,
    t: TRANSLATIONS[activeLang]
  }), [activeLang, targetLang, setLang]);

  return h(LangContext.Provider, { value }, children);
}

/* ============================================================
   QUALITY DETECTION
   ============================================================ */

function detectQuality() {
  const ua = (navigator.userAgent || '').toLowerCase();
  const isMobile = /android|iphone|ipad|ipod|mobile/.test(ua) ||
                   (navigator.maxTouchPoints > 1 && window.innerWidth < 900);
  const cores = navigator.hardwareConcurrency || 8;
  const mem = navigator.deviceMemory || 8;
  const weak = isMobile || cores <= 4 || mem <= 4;
  return { weak, isMobile };
}

/* ============================================================
   SMOKE BACKGROUND
   ============================================================ */

const fpsTarget = { el: null };

function SmokeBackground() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;

    const q = detectQuality();
    if (q.weak) document.body.classList.add('weak');

    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: false,
        alpha: false,
        powerPreference: 'high-performance',
        failIfMajorPerformanceCaveat: false
      });
    } catch (e) {
      document.body.classList.add('smoke-fallback');
      canvas.style.display = 'none';
      return;
    }

    const gl = renderer.getContext();
    if (!gl) {
      document.body.classList.add('smoke-fallback');
      canvas.style.display = 'none';
      return;
    }

    const dprCap = q.weak ? 1.0 : (window.innerWidth < 1440 ? 1.0 : 1.15);
    const dpr = Math.min(window.devicePixelRatio || 1, dprCap);

    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.setClearColor(0x050308, 1);

    let rtScale = q.weak ? 0.55 : 0.85;

    const scene = new THREE.Scene();
    const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const makeRT = (scale) => {
      const w = Math.max(2, Math.floor(window.innerWidth * dpr * scale));
      const h = Math.max(2, Math.floor(window.innerHeight * dpr * scale));
      const rt = new THREE.WebGLRenderTarget(w, h, {
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        wrapS: THREE.ClampToEdgeWrapping,
        wrapT: THREE.ClampToEdgeWrapping,
        type: THREE.UnsignedByteType,
        format: THREE.RGBAFormat,
        depthBuffer: false,
        stencilBuffer: false
      });
      return rt;
    };

    let writeRT = makeRT(rtScale);
    let readRT = makeRT(rtScale);

    /* ---- Smoke material ---- */
    const smokeUniforms = {
      uTime:    { value: 0 },
      uMouse:   { value: new THREE.Vector2(0, 0) },
      uRes:     { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uQuality: { value: q.weak ? 0.0 : 1.0 },
      uSpeed:   { value: prefersReduced ? 0.15 : 1.0 }
    };

    const smokeMat = new THREE.ShaderMaterial({
      uniforms: smokeUniforms,
      vertexShader: smokeVert,
      fragmentShader: smokeFrag,
      depthTest: false,
      depthWrite: false
    });

    const smokeGeo = new THREE.PlaneGeometry(2, 2);
    const smokeQuad = new THREE.Mesh(smokeGeo, smokeMat);
    smokeQuad.frustumCulled = false;
    scene.add(smokeQuad);

    /* ---- Blur material ---- */
    const blurUniforms = {
      uCurrent: { value: writeRT.texture },
      uPrev:    { value: readRT.texture },
      uVel:     { value: new THREE.Vector2(0, 0) },
      uBlur:    { value: q.weak ? 0.04 : 0.07 },
      uBlend:   { value: q.weak ? 0.70 : 0.78 }
    };

    const blurMat = new THREE.ShaderMaterial({
      uniforms: blurUniforms,
      vertexShader: blurVert,
      fragmentShader: blurFrag,
      depthTest: false,
      depthWrite: false
    });

    const blurGeo = new THREE.PlaneGeometry(2, 2);
    const blurQuad = new THREE.Mesh(blurGeo, blurMat);
    blurQuad.frustumCulled = false;
    const blurScene = new THREE.Scene();
    blurScene.add(blurQuad);

    /* ---- Mouse state ---- */
    const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    let prevMX = 0, prevMY = 0;
    const vel = { x: 0, y: 0 };

    const onMove = (e) => {
      mouse.tx = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.ty = -((e.clientY / window.innerHeight) * 2 - 1);
    };
    window.addEventListener('mousemove', onMove, { passive: true });

    /* ---- Resize ---- */
    let resizeRaf = 0;
    const onResize = () => {
      if (resizeRaf) cancelAnimationFrame(resizeRaf);
      resizeRaf = requestAnimationFrame(() => {
        resizeRaf = 0;
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h, false);
        smokeUniforms.uRes.value.set(w, h);
        const rw = Math.max(2, Math.floor(w * dpr * rtScale));
        const rh = Math.max(2, Math.floor(h * dpr * rtScale));
        writeRT.setSize(rw, rh);
        readRT.setSize(rw, rh);
      });
    };
    window.addEventListener('resize', onResize);

    /* ---- Loop ---- */
    let raf = 0;
    let last = performance.now();
    let time = 0;

    let fpsFrames = 0;
    let fpsLast = performance.now();
    let lowFpsStreak = 0;

    const tick = (now) => {
      raf = requestAnimationFrame(tick);
      if (document.hidden) {
        last = now;
        return;
      }

      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      time += dt;

      /* FPS sampling */
      fpsFrames++;
      if (now - fpsLast >= 500) {
        const fps = Math.round(fpsFrames / ((now - fpsLast) / 1000));
        if (fpsTarget.el) fpsTarget.el.textContent = fps + ' FPS';
        fpsFrames = 0;
        fpsLast = now;

        if (fps < 45 && !q.weak) {
          lowFpsStreak++;
          if (lowFpsStreak >= 2) {
            document.body.classList.add('low-fps');
            if (rtScale > 0.5) {
              rtScale = Math.max(0.5, rtScale - 0.15);
              const w = window.innerWidth, h = window.innerHeight;
              writeRT.setSize(Math.max(2, Math.floor(w * dpr * rtScale)), Math.max(2, Math.floor(h * dpr * rtScale)));
              readRT.setSize(Math.max(2, Math.floor(w * dpr * rtScale)), Math.max(2, Math.floor(h * dpr * rtScale)));
            }
            lowFpsStreak = 0;
          }
        } else {
          lowFpsStreak = 0;
        }
      }

      /* Mouse lerp */
      mouse.x += (mouse.tx - mouse.x) * 0.08;
      mouse.y += (mouse.ty - mouse.y) * 0.08;

      /* Velocity (smoothed difference) */
      const dx = mouse.x - prevMX;
      const dy = mouse.y - prevMY;
      prevMX = mouse.x;
      prevMY = mouse.y;

      const speedScale = prefersReduced ? 30 : 1;
      const tvx = dx * speedScale;
      const tvy = dy * speedScale;

      vel.x += (tvx - vel.x) * 0.20;
      vel.y += (tvy - vel.y) * 0.20;
      if (Math.abs(vel.x) < 0.0008) vel.x = 0;
      if (Math.abs(vel.y) < 0.0008) vel.y = 0;

      /* Uniform updates */
      smokeUniforms.uTime.value = time;
      smokeUniforms.uMouse.value.set(mouse.x, mouse.y);

      blurUniforms.uVel.value.set(vel.x, -vel.y);
      blurUniforms.uCurrent.value = writeRT.texture;
      blurUniforms.uPrev.value = readRT.texture;

      /* Pass 1: smoke -> writeRT */
      renderer.setRenderTarget(writeRT);
      renderer.render(scene, cam);

      /* Pass 2: blur -> screen */
      renderer.setRenderTarget(null);
      renderer.render(blurScene, cam);

      /* Swap ping-pong */
      const tmp = writeRT;
      writeRT = readRT;
      readRT = tmp;
    };

    raf = requestAnimationFrame(tick);

    /* ---- Cleanup ---- */
    return () => {
      cancelAnimationFrame(raf);
      if (resizeRaf) cancelAnimationFrame(resizeRaf);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('resize', onResize);

      writeRT.dispose();
      readRT.dispose();
      smokeGeo.dispose();
      blurGeo.dispose();
      smokeMat.dispose();
      blurMat.dispose();

      renderer.dispose();
      try { renderer.forceContextLoss(); } catch (e) { /* ignore */ }
    };
  }, []);

  return h('canvas', { ref: canvasRef, className: 'smoke-canvas' });
}

/* ============================================================
   CURSOR GLOW
   ============================================================ */

function CursorGlow() {
  const ref = useRef(null);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!window.matchMedia('(hover: hover) and (min-width: 768px)').matches) return;

    let tx = window.innerWidth / 2;
    let ty = window.innerHeight / 2;
    let x = tx, y = ty;
    let raf = 0;
    let running = true;

    const onMove = (e) => { tx = e.clientX; ty = e.clientY; };
    window.addEventListener('mousemove', onMove, { passive: true });

    const loop = () => {
      if (!running) return;
      x += (tx - x) * 0.15;
      y += (ty - y) * 0.15;
      el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    return () => {
      running = false;
      cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', onMove);
    };
  }, []);

  return h('div', { ref, className: 'cursor-glow' });
}

/* ============================================================
   REVEAL
   ============================================================ */

function Reveal({ children, delay = 0, className = '', as = 'div', ...rest }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;

    if (typeof IntersectionObserver === 'undefined') {
      setShown(true);
      return;
    }

    const rect = el.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    if (rect.top < vh - 40 && rect.bottom > 0) {
      setShown(true);
      return;
    }

    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) {
          setShown(true);
          io.unobserve(e.target);
        }
      }
    }, { threshold: 0.12, rootMargin: '-40px 0px' });

    io.observe(el);
    return () => io.disconnect();
  }, []);

  return h(
    as,
    {
      ref,
      className: 'reveal' + (shown ? ' in' : '') + (className ? ' ' + className : ''),
      style: { transitionDelay: delay + 'ms' },
      ...rest
    },
    children
  );
}

function Navbar() {
  const { t } = useLang();
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    let raf = 0;
    let pending = false;

    const update = () => {
      pending = false;
      setScrolled(window.scrollY > 24);
    };

    const onScroll = () => {
      if (pending) return;
      pending = true;
      raf = requestAnimationFrame(update);
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    update();

    return () => {
      window.removeEventListener('scroll', onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  return h('nav', { className: 'nav' + (scrolled ? ' scrolled' : '') },
    h('div', { className: 'nav-inner' },
      h('a', { className: 'nav-logo', href: '#top', 'aria-label': 'UNIX Research' },

/* ============================================================
   COPY BUTTON
   ============================================================ */

function CopyButton({ text }) {
  const { t } = useLang();
  const [copied, setCopied] = useState(false);

  const onClick = useCallback((e) => {
    e.stopPropagation();
    e.preventDefault();
    const done = () => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => {});
    } else {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      } catch (err) { /* ignore */ }
    }
  }, [text]);

  return h('button', {
    type: 'button',
    className: 'btn-copy',
    onClick
  }, copied ? t.actions.copied : t.actions.copy);
}

function Catalog() {
  const { t } = useLang();
  const [query, setQuery] = useState('');
  const [category, setCategory] = useState('All');
  const [active, setActive] = useState(null);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return TOOLS.filter((tool) => {
      if (category !== 'All' && tool.cat !== category) return false;
      if (!q) return true;
      const haystack = [
        tool.name,
        tool.cat,
        t.categories[tool.cat] || tool.cat,
        tool.command,
        tool.short.en, tool.short.ru,
        tool.long.en, tool.long.ru
      ].join(' ').toLowerCase();
      return haystack.indexOf(q) !== -1;
    });
  }, [query, category, t]);

  const onOpen = useCallback((tool) => setActive(tool), []);
  const onClose = useCallback(() => setActive(null), []);

  return h('section', { className: 'section', id: 'catalog' },
    h('div', { className: 'container' },
      h(Reveal, { className: 'section-head' },
        h('span', { className: 'eyebrow' }, t.catalog.eyebrow),

        h('div', { className: 'chips' },

            h('button', {
              key: cat,
              type: 'button',
              className: 'chip' + (category === cat ? ' active' : ''),
              onClick: () => setCategory(cat)
            }, t.categories[cat] || cat)
          )

      ),

      h('div', { className: 'catalog-grid' },
        filtered.length === 0

              h(Reveal, { key: tool.name, delay: Math.min(i, 8) * 55 },

    active ? h(ToolModal, { tool: active, onClose }) : null
